name: Agentic AI Backend Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/agentic-ai-tests.yml"
  push:
    branches:
      - feature/agentic-ai-upgrade
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agentic AI tests
        run: python -m unittest discover -s tests -v

      - name: Run retrieval benchmark
        run: python -m evaluation.run_retrieval_benchmark
